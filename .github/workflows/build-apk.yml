name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # android 폴더는 저장소에 두지 않고 매번 생성합니다 (패키지명: com.family.family_budget)
      - name: Generate Android platform files
        run: flutter create . --platforms=android --org com.family --project-name family_budget

      - name: Patch Android settings
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          # 릴리즈 빌드에도 인터넷 권한 추가
          grep -q 'android.permission.INTERNET' "$MANIFEST" || \
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$MANIFEST"
          # 앱 이름
          sed -i 's#android:label="[^"]*"#android:label="우리집 가계부"#' "$MANIFEST"
          # Firebase 최신 버전은 minSdk 23 이상이 필요
          sed -i -E 's/minSdk(Version)? *=? *flutter\.minSdkVersion/minSdk = 24/' android/app/build.gradle* || true

      - run: flutter pub get

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }} \
            --dart-define=FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }} \
            --dart-define=FIREBASE_SENDER_ID=${{ secrets.FIREBASE_SENDER_ID }} \
            --dart-define=FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }} \
            --dart-define=FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}

      - uses: actions/upload-artifact@v4
        with:
          name: family-budget-apk
          path: build/app/outputs/flutter-apk/app-release.apk
